name: fetch data

# Downloads the CU-BEMS building data (figshare) and Bangkok weather, condenses them with
# tools/prepare_data.py and commits the result to data/. Runs when the script or this file changes,
# or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch_data.yml", "tools/prepare_data.py", "tools/download.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download CU-BEMS (figshare 11726517)
        run: |
          mkdir -p raw data
          python tools/download.py raw 2>&1 | tee data/download_log.txt
      - run: python tools/prepare_data.py raw data 2>&1 | tee -a data/download_log.txt
        if: always()
      - name: Commit data
        if: always()
        run: |
          git config user.name "Malmand"
          git config user.email "201303087+Malmand@users.noreply.github.com"
          git add data
          git commit -m "Add condensed CU-BEMS data and Bangkok weather" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 10; done
